name: Upload WAR to Release

on:
  release:
    types:
      - published

jobs:
  upload-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Boot WAR
        run: ./gradlew clean bootWar

      - name: Upload WAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.war
