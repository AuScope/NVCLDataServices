name: Upload WAR to Release

on:
  release:
    types:
      - published

jobs:
  upload-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify version matches release tag
        run: |
          TAG_VERSION="${{ github.event.release.tag_name }}"
          GRADLE_VERSION=$(./gradlew properties -q | grep "^version:" | awk '{print $2}')
      
          echo "Tag version: $TAG_VERSION"
          echo "Gradle version: $GRADLE_VERSION"
      
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "ERROR: Release tag does not match project version.  Update build.gradle version and try again."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Boot WAR
        run: ./gradlew clean bootWar

      - name: Upload WAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.war
